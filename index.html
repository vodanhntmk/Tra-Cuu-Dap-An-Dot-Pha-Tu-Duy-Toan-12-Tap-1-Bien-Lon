<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Đáp Án Đột Phá Tư Duy 12 Tập 1 - Biển Lớn</title>
    <!-- ai muốn clone cái web này nhớ ghi đồng tác giả là Biển Lớn nha -->
    
    <!-- FontAwesome & Font Plus Jakarta Sans -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

    <style>
        :root {
            --rgb-gradient: linear-gradient(45deg, #ff0055, #ff5000, #ffcc00, #00ff66, #00ffff, #0066ff, #9900ff, #ff0055);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body { 
            background: #030408;
            color: #f5f5f7; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Vibrant Animated Ambient Spheres */
        body::before, body::after {
            content: '';
            position: fixed;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            opacity: 0.55;
            pointer-events: none;
            animation: floatGlow 8s infinite alternate ease-in-out;
        }

        body::before { 
            background: radial-gradient(circle, #ff007f 0%, #7928ca 100%); 
            top: -80px; 
            left: -80px; 
        }
        body::after { 
            background: radial-gradient(circle, #00f2fe 0%, #4facfe 100%); 
            bottom: -80px; 
            right: -80px; 
            animation-delay: -4s; 
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); filter: blur(130px) hue-rotate(0deg); }
            100% { transform: translate(50px, 50px) scale(1.25); filter: blur(150px) hue-rotate(360deg); }
        }

        .container { 
            max-width: 720px; 
            width: 100%; 
            animation: appleFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1 { 
            text-align: center; 
            font-size: 2.2rem; 
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--rgb-gradient);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rgbShift 6s ease infinite;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: var(--rgb-gradient);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rgbShift 4s ease infinite;
            margin-bottom: 28px;
        }

        @keyframes rgbShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Quick Navigation Bar */
        .nav-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .nav-btn {
            position: relative;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(18, 20, 32, 0.6);
            color: #e0e0e0;
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            overflow: hidden;
        }

        .nav-btn:hover {
            border-color: rgba(255, 255, 255, 0.4);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.3);
        }

        .nav-btn.donate-btn:hover {
            box-shadow: 0 8px 25px rgba(255, 0, 127, 0.4);
        }

        .nav-btn.dl-btn:hover {
            box-shadow: 0 8px 25px rgba(0, 255, 102, 0.3);
        }

        .nav-btn:active { transform: translateY(0) scale(0.98); }

        /* Glowing RGB Border Box */
        .search-card-wrapper {
            position: relative;
            border-radius: 18px;
            padding: 2px;
            background: var(--rgb-gradient);
            background-size: 400% 400%;
            animation: rgbShift 5s ease infinite;
            margin-bottom: 28px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.3);
        }

        .search-card-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 18px;
            background: var(--rgb-gradient);
            background-size: 400% 400%;
            animation: rgbShift 5s ease infinite;
            filter: blur(12px);
            opacity: 0.6;
            z-index: -1;
        }

        .search-box { 
            display: flex; 
            gap: 10px; 
            background: rgba(10, 12, 20, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px;
            border-radius: 16px;
        }

        input { 
            flex: 1; 
            padding: 14px 18px; 
            font-size: 15px; 
            font-weight: 500;
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(255, 255, 255, 0.05); 
            color: #fff; 
            outline: none; 
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        input::placeholder { color: #8a8a93; }

        input:focus { 
            background: rgba(255, 255, 255, 0.08);
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        button.search-btn { 
            padding: 14px 26px; 
            font-size: 14px; 
            font-weight: 800; 
            background: var(--rgb-gradient);
            background-size: 300% 300%;
            animation: rgbShift 4s ease infinite;
            color: #ffffff; 
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button.search-btn:hover { 
            transform: scale(1.04);
            box-shadow: 0 6px 25px rgba(255, 0, 127, 0.6);
        }

        button.search-btn:active { transform: scale(0.97); }

        /* Glassmorphism Result Container */
        .result-card { 
            position: relative;
            background: rgba(14, 16, 26, 0.75); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px; 
            padding: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            animation: appleSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .result-header {
            font-size: 1.05rem;
            font-weight: 800;
            background: var(--rgb-gradient);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rgbShift 3s ease infinite;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .img-container { margin-top: 15px; text-align: center; }
        .img-container p { color: #a1a1a6; font-size: 12px; margin-bottom: 8px; font-weight: 600; }
        .img-container img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 14px; 
            margin-bottom: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .img-container img:hover { transform: scale(1.015); }
        .no-result { text-align: center; color: #ff3b30; font-weight: 700; padding: 20px; }

        /* Modal Ủng Hộ VietQR */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: appleFadeIn 0.3s ease-out;
        }

        .modal-card {
            background: rgba(18, 20, 32, 0.95);
            border: 2px solid transparent;
            background-clip: padding-box;
            border-radius: 24px;
            padding: 28px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.4);
            position: relative;
            animation: appleSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-card h3 { 
            background: linear-gradient(135deg, #ff007f, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px; 
            font-size: 1.3rem; 
            font-weight: 800; 
        }
        .modal-card p { font-size: 13px; color: #b0b0b8; margin-bottom: 18px; line-height: 1.5; }
        .modal-card img { width: 100%; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.15); }
        
        .close-btn {
            position: absolute;
            top: 14px; right: 16px;
            background: rgba(255, 255, 255, 0.1); border: none;
            color: #aaa; width: 30px; height: 30px; border-radius: 50%;
            font-size: 16px; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .close-btn:hover { color: #fff; background: rgba(255, 0, 127, 0.5); }

        /* Apple Animations */
        @keyframes appleFadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes appleSlideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ĐỘT PHÁ TƯ DUY TOÁN 12 TẬP 1</h1>
    <div class="subtitle">Made by Biển Lớn</div>
    
    <!-- Action Bar -->
    <div class="nav-actions">
        <a href="https://vodanhntmk.github.io/Tra-Cuu-Dap-An-Dot-Pha-Tu-Duy-Toan-12-Tap-2-Bien-Lon/" class="nav-btn" target="_blank">
            <i class="fa-solid fa-arrow-right text-cyan-400"></i> Tra cứu Tập 2
        </a>
        <a href="https://api.telegram.org/file/bot8640073161:AAGYBLmvt5P9ASyuHmKPGnwn9N8LV8QuTm4/documents/file_1.pdf" class="nav-btn dl-btn" target="_blank" download>
            <i class="fa-solid fa-file-pdf text-emerald-400"></i> Đề GK1
        </a>
        <a href="https://api.telegram.org/file/bot8640073161:AAGYBLmvt5P9ASyuHmKPGnwn9N8LV8QuTm4/documents/file_2.pdf" class="nav-btn dl-btn" target="_blank" download>
            <i class="fa-solid fa-file-pdf text-emerald-400"></i> Đề GK2
        </a>
        <a href="https://api.telegram.org/file/bot8640073161:AAGYBLmvt5P9ASyuHmKPGnwn9N8LV8QuTm4/documents/file_3.pdf" class="nav-btn dl-btn" target="_blank" download>
            <i class="fa-solid fa-check-double text-amber-400"></i> Phiếu tô
        </a>
        <button class="nav-btn donate-btn" onclick="openDonate()">
            <i class="fa-solid fa-heart text-pink-500"></i> Ủng hộ
        </button>
    </div>

    <div class="search-card-wrapper">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Nhập mã ID (VD: 110574, 110084...)" onkeyup="if(event.key==='Enter') searchID()">
            <button class="search-btn" onclick="searchID()">
                <i class="fa-solid fa-magnifying-glass"></i> Tìm kiếm
            </button>
        </div>
    </div>

    <div id="result" class="result-card" style="display: none;"></div>
</div>

<!-- Modal QR Ủng hộ -->
<div id="donateModal" class="modal-overlay" onclick="closeDonate(event)">
    <div class="modal-card">
        <button class="close-btn" onclick="toggleDonateModal(false)">&times;</button>
        <h3>💖 Ủng Hộ Biển Lớn</h3>
        <p>Mỗi sự ủng hộ của bạn là động lực để mình tiếp tục duy trì web!</p>
        <img src="https://api.vietqr.io/image/970422-0876680302-51.jpg?accountName=HA%20DAI%20HAI" alt="QR VietQR Hà Đại Hải">
    </div>
</div>

<script>
    let dbData = [];

    fetch('data.json')
        .then(res => res.json())
        .then(data => { dbData = data; })
        .catch(err => console.error("Chưa thấy file data.json!", err));

    function searchID() {
        const query = document.getElementById('searchInput').value.trim();
        const resultDiv = document.getElementById('result');

        if (!query) return;

        const specialIDs = ["1", "2", "3", "4","5","6","7","8","9","0","10","11","12", "36", "37", "38", "3636", "363636", "367", "369", "367369","Biển Lớn", "BIỂN LỚN","biển lớn","bien lon","BIEN LON","Bien Lon", "bienlon","BIENLON","BienLon"];

        resultDiv.style.display = 'block';

        // 1. Đối với ID đặc biệt:
        if (specialIDs.includes(query)) {
            resultDiv.innerHTML = `
                <div class="result-header"><i class="fa-solid fa-thumbtack"></i> Mã bài tập: ${query} (Đặc biệt)</div>
                <div class="img-container">
                    <img src="bienlondata/999999.png" alt="Ảnh đặc biệt 999999">
                </div>
            `;
            return;
        }

        // Tìm bài tập trong dbData dựa trên mã ID nhập vào
        const item = dbData.find(x => x.id === query);

        // Nếu không tìm thấy bài tập trong data.json
        if (!item) {
            resultDiv.innerHTML = `<div class="no-result"><i class="fa-solid fa-circle-xmark"></i> Không tìm thấy mã ID <b>${query}</b></div>`;
            return;
        }

        // 2. Đối với bài tập thông thường:
        let imagesHtml = '';
        if (item.pages === 1) {
            imagesHtml += `<div class="img-container"><img src="bienlondata/${item.id}.png" alt="Đáp án ${item.id}"></div>`;
        } else {
            for (let i = 1; i <= item.pages; i++) {
                imagesHtml += `
                    <div class="img-container">
                        <p>Trang ${i} / ${item.pages}</p>
                        <img src="bienlondata/${item.id}-${i}.png" alt="Đáp án ${item.id} trang ${i}">
                    </div>`;
            }
        }

        resultDiv.innerHTML = `
            <div class="result-header"><i class="fa-solid fa-file-invoice"></i> Mã bài tập: ${item.id} (${item.pages} trang)</div>
            ${imagesHtml}
        `;
    }

    function toggleDonateModal(show) {
        document.getElementById('donateModal').style.display = show ? 'flex' : 'none';
    }

    function openDonate() {
        toggleDonateModal(true);
    }

    function closeDonate(e) {
        if (e.target.id === 'donateModal') {
            toggleDonateModal(false);
        }
    }
</script>

</body>
</html>
